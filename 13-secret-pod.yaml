apiVersion: v1
kind: Pod
metadata:
  name: pod-secret-demo
  labels:
    project: roboshop
    environment: dev
spec:
  containers:
  - name: nginx
    image: nginx
    resources:
      requests:
        memory: "68Mi"
        cpu: "100m"
      limits:
        memory: "100Mi"
        cpu: "120m"
    envFrom:
    - secretRef:
        name: secret-demo
