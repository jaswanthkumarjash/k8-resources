apiVersion: v1
kind: Pod
metadata:
  name: configmap-pod-demo
  labels:
    project: roboshop
    environment: dev
spec:
  containers:
  - name: nginx
    image: nginx
    envFrom:
    - configMapRef:
        name: configmap-demo
    resources:
      requests:
        memory: "68Mi"
        cpu: "100m"
      limits:
        memory: "100Mi"
        cpu: "120m"